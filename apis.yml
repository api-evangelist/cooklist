aid: cooklist
name: Cooklist
description: >-
  Cooklist is an agentic commerce platform purpose-built for grocery and retail.
  It provides retailer-native AI shopping assistants that plan meals, run
  solution-first agentic search over live catalog and inventory, assemble
  cart-ready bundles, and execute verified cart operations against the retailer's
  system of record. Founded in 2018, Cooklist powers the first agentic AI
  shopping experience launched by Kroger (the Kroger AI Meal Assistant, live
  since December 2025) and integrates with 15+ retailer catalogs. Retailers embed
  a drop-in JavaScript SDK that talks to Cooklist over HTTPS (GraphQL) and WSS
  (real-time streaming); a B2B Partner API (API key or JWT auth, per-organization
  field allowlists), authenticated webhooks, and a Model Context Protocol (MCP)
  interface expose real-time retail inventory and pricing to third-party LLMs
  such as ChatGPT and Gemini for off-site agentic commerce.
